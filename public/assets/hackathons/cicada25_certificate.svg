<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Cyan Purple Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Border Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="840" fill="url(#bgGrad)" />
  <rect width="1200" height="840" fill="url(#gridPattern)" />

  <!-- Outer Elegant Borders -->
  <rect x="30" y="30" width="1140" height="780" fill="none" stroke="#334155" stroke-width="2" rx="16" />
  <rect x="42" y="42" width="1116" height="756" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" rx="12" />
  <rect x="52" y="52" width="1096" height="736" fill="none" stroke="#1e293b" stroke-width="1" rx="8" />

  <!-- Corner Ornaments -->
  <!-- Top-Left -->
  <path d="M 42 100 L 100 42 M 42 120 L 120 42 M 42 140 L 140 42" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
  <!-- Top-Right -->
  <path d="M 1158 100 L 1100 42 M 1158 120 L 1080 42 M 1158 140 L 1060 42" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
  <!-- Bottom-Left -->
  <path d="M 42 740 L 100 798 M 42 720 L 120 798 M 42 700 L 140 798" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
  <!-- Bottom-Right -->
  <path d="M 1158 740 L 1100 798 M 1158 720 L 1080 798 M 1158 700 L 1060 798" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Institution & Organization Header -->
  <text x="600" y="115" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#94a3b8">
    KPR INSTITUTE OF ENGINEERING AND TECHNOLOGY
  </text>
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#38bdf8">
    DEPARTMENT OF ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE
  </text>
  <text x="600" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#a78bfa">
    KPRIET ACM STUDENT CHAPTER &amp; SPARKS STUDENT ASSOCIATION
  </text>

  <!-- Decorative Separator -->
  <line x1="350" y1="200" x2="850" y2="200" stroke="url(#neonGrad)" stroke-width="2" />
  <circle cx="600" cy="200" r="5" fill="#fef08a" />

  <!-- Hackathon Title -->
  <text x="600" y="260" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="6" fill="url(#neonGrad)" filter="url(#glow)">
    CICADA 2025
  </text>
  <text x="600" y="295" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#cbd5e1">
    24-HOUR NATIONAL LEVEL HACKATHON
  </text>

  <!-- Certificate Sub-Header -->
  <rect x="440" y="325" width="320" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <text x="600" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#e0e7ff">
    CERTIFICATE OF PARTICIPATION
  </text>

  <!-- Recipient Section -->
  <text x="600" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#94a3b8">
    This certificate is proudly presented to
  </text>

  <text x="600" y="465" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="800" letter-spacing="2" fill="url(#goldGrad)">
    DINESH H
  </text>
  <line x1="420" y1="485" x2="780" y2="485" stroke="#475569" stroke-width="1.2" stroke-dasharray="6,4" />

  <text x="600" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#38bdf8">
    Saveetha Engineering College
  </text>

  <!-- Citation Body -->
  <text x="600" y="565" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14.5" fill="#cbd5e1">
    for actively participating and demonstrating exemplary technical innovation in the 24-Hour
  </text>
  <text x="600" y="592" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14.5" fill="#cbd5e1">
    National Level Hackathon <tspan font-weight="700" fill="#f8fafc">CICADA'25</tspan> as part of <tspan font-weight="700" fill="#a78bfa">Team #MACROHARD</tspan>
  </text>
  <text x="600" y="618" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500" fill="#94a3b8">
    Project: Industrial COBOT (Human–Robot Collaboration &amp; Vision Tracking)
  </text>

  <!-- Date & Venue -->
  <text x="600" y="655" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
    Held on: October 31 – November 1, 2025  |  KPRIET Campus, Coimbatore, Tamil Nadu
  </text>

  <!-- Signatures & Official Badges -->
  <g transform="translate(180, 700)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#64748b" stroke-width="1.2" />
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Staff Coordinator</text>
    <text x="90" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">KPRIET ACM / SPARKS</text>
  </g>

  <!-- Gold Seal Emblem -->
  <g transform="translate(600, 715)">
    <circle cx="0" cy="0" r="42" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,2" />
    <polygon points="0,-16 5,-5 16,-5 8,3 11,14 0,8 -11,14 -8,3 -16,-5 -5,-5" fill="url(#goldGrad)" />
    <text x="0" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" letter-spacing="1" fill="#fef08a">VERIFIED</text>
  </g>

  <g transform="translate(840, 700)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#64748b" stroke-width="1.2" />
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Head of Department</text>
    <text x="90" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Dept of AI &amp; Data Science</text>
  </g>

  <!-- Verification ID footer -->
  <text x="600" y="805" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">
    RECORD ID: KPRIET-CICADA25-SEC-DINESH-H-PARTICIPANT | OFFICIAL VERIFIED CREDENTIAL
  </text>
</svg>
